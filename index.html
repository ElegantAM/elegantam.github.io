<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AEGIS-X Engine</title>
</head>
<body>
    <h2>AEGIS-X ENGINE</h2>
    <textarea id="problem" placeholder="Describe your issue here..." rows="4" style="width: 100%;"></textarea>
    <br><br>
    <button onclick="runAnalysis()">RUN ANALYSIS</button>
    <h3 id="result"></h3>

    <script>
        async function runAnalysis() {
            const input = document.getElementById('problem').value;
            const output = document.getElementById('result');
            
            if (!input) {
                alert("Please enter an issue to analyze.");
                return;
            }

            output.innerText = "Analyzing... (If the server was asleep, this may take 60 seconds)";
            
            try {
                const response = await fetch('https://aegis-backend-oms5.onrender.com/submit', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ problem: input })
                });
                
                const data = await response.json();
                
                if (data.analysis) {
                    output.innerText = "Analysis: " + data.analysis;
                } else {
                    output.innerText = "Error: " + (data.error || "Unknown server error");
                }
            } catch (error) {
                output.innerText = "Connection failed. Please wait a minute and ensure the Render backend is awake.";
            }
        }
    </script>
</body>
</html>
